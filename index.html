<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e5679b" />
  <title>Mi Ciclo · La Bonita</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 id="viewTitle">Inicio</h1>
    <button id="themeToggle" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
  </header>

  <!-- Pantalla de bloqueo (PIN) -->
  <div id="lockScreen" class="lock-screen" hidden>
    <div class="lock-inner">
      <div class="lock-emoji">🔒</div>
      <h2>Mi Ciclo</h2>
      <p id="lockMsg">Ingresa tu PIN</p>
      <div class="pin-dots" id="pinDots"></div>
      <div class="keypad" id="keypad"></div>
      <button id="lockCancel" class="btn btn-ghost btn-sm" hidden>Cancelar</button>
    </div>
  </div>

  <!-- Área oculta que se usa solo al imprimir el informe -->
  <div id="printArea" aria-hidden="true"></div>

  <main id="app">
    <!-- Vista: Inicio -->
    <section id="view-home" class="view active"></section>

    <!-- Vista: Calendario -->
    <section id="view-calendar" class="view"></section>

    <!-- Vista: Estadísticas -->
    <section id="view-stats" class="view"></section>

    <!-- Vista: Ajustes -->
    <section id="view-settings" class="view"></section>
  </main>

  <!-- Editor del día (hoja modal) -->
  <div id="dayEditor" class="sheet-backdrop" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <div class="sheet-handle"></div>
      <h2 id="editorTitle">Registro del día</h2>
      <div id="editorBody"></div>
      <div class="sheet-actions">
        <button id="editorDelete" class="btn btn-ghost">Borrar día</button>
        <div class="spacer"></div>
        <button id="editorCancel" class="btn btn-ghost">Cancelar</button>
        <button id="editorSave" class="btn btn-primary">Guardar</button>
      </div>
    </div>
  </div>

  <nav class="tabbar">
    <button class="tab active" data-view="home"><span class="tab-ico">🏠</span><span>Inicio</span></button>
    <button class="tab" data-view="calendar"><span class="tab-ico">📅</span><span>Calendario</span></button>
    <button class="tab" data-view="stats"><span class="tab-ico">📊</span><span>Stats</span></button>
    <button class="tab" data-view="settings"><span class="tab-ico">⚙️</span><span>Ajustes</span></button>
  </nav>

  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/predict.js"></script>
  <script src="js/personalize.js"></script>
  <script src="js/security.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/report.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
